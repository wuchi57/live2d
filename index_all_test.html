<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live2D PixiJS - Model Switcher</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    html {
      /* 保持您原来的窗口大小和背景设置 */
      background-color: transparent;
    }
    canvas {
      display: block;
    }
    /* 为模型切换器添加样式 */
    #model-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border-radius: 5px;
      color: white;
      font-family: sans-serif;
      font-size: 12px;
    }
    #model-switcher {
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <!-- 添加一个用于切换模型的UI控件 -->
  <div id="model-controls">
    <label for="model-switcher">选择模型:</label>
    <select id="model-switcher"></select>
  </div>

  <canvas id="canvas"></canvas>

  <!-- Live2D Core & Libraries -->
  <script src="https://cdn.jsdelivr.net/gh/wuchi57/live2d/core/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wuchi57/live2d/core/live2d.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wuchi57/live2d/core/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wuchi57/live2d/core/index.min.js"></script>

  <script>
    (async function main() {
      // 1. 将所有模型路径存储在一个数组中
      // 通过 live server 插件在本地使用
      const localModels = [
        "./models/Haru/Haru.model3.json",
        "./models/Hiyori/Hiyori.model3.json",
        "./models/KITU_RE23/KITU_RE23.model3.json",
        "./models/Mao/Mao.model3.json",
        "./models/Mark/Mark.model3.json",
        "./models/Natori/Natori.model3.json",
        "./models/Rice/Rice.model3.json",
        "./models/Wanko/Wanko.model3.json",
        "./models/Histoire/model.json",
        "./models/IceGirl/IceGIrl/IceGirl.model3.json",
        "./models/Idol02/Idol2_Public_ver_1/Idol2_Public_ver_1.model3.json",
        "./models/Kuma2020/kuma2020.model3.json",
        "./models/LiveroiD_A_1.2/Live2DModels/LiveroiD_A-Y01/LiveroiD_A-Y01.model3.json",
        "./models/LiveroiD_A_1.2/Live2DModels/LiveroiD_A-Y02/LiveroiD_A-Y02.model3.json",
        "./models/Mashiro/ryoufuku.model.json",
        "./models/Mashiro/seifuku.model.json",
        "./models/Mashiro/shifuku.model.json",
        "./models/MIHARI_VTS/Mihari_V1.model3.json",
        "./models/Sagiri/sagiri.model.json",
      ];
      // 使用在线，有些模型不稳定
      const localModels1 = [        
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Haru/Haru.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Hiyori/Hiyori.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/KITU_RE23/KITU_RE23.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Mao/Mao.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Mark/Mark.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Natori/Natori.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Rice/Rice.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Wanko/Wanko.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Histoire/model.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/IceGirl/IceGIrl/IceGirl.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Idol02/Idol2_Public_ver_1/Idol2_Public_ver_1.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Kuma2020/kuma2020.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/LiveroiD_A_1.2/Live2DModels/LiveroiD_A-Y01/LiveroiD_A-Y01.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/LiveroiD_A_1.2/Live2DModels/LiveroiD_A-Y02/LiveroiD_A-Y02.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Mashiro/ryoufuku.model.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Mashiro/seifuku.model.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Mashiro/shifuku.model.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/MIHARI_VTS/Mihari_V1.model3.json",
        "https://cdn.jsdelivr.net/gh/wuchi57/live2d/models/Sagiri/sagiri.model.json",
      ];

      // 初始化 PIXI 应用
      const app = new PIXI.Application({
        view: document.getElementById("canvas"),
        autoStart: true,
        resizeTo: window,
        transparent: true,
      });

      // 获取下拉菜单元素
      const modelSwitcher = document.getElementById("model-switcher");

      // 2. 动态填充下拉菜单选项
      localModels.forEach(path => {
        const option = document.createElement("option");
        option.value = path;
        // 从路径中提取模型名称作为显示文本
        const modelName = path.split('/')[2];
        option.innerText = modelName;
        modelSwitcher.appendChild(option);
      });

      // 3. 创建一个可复用的模型加载函数
      async function loadModel(modelPath) {
        // 先移除舞台上所有子元素，即清除旧模型
        app.stage.removeChildren();

        // 加载新模型
        const model = await PIXI.live2d.Live2DModel.from(modelPath);

        // 将模型添加到舞台
        app.stage.addChild(model);
        
        // 4. 判断模型版本并应用不同设置
        if (modelPath.endsWith('.model3.json')) {
          // 这是 Cubism 4+ 模型
          console.log(`加载 Cubism 4 模型: ${modelPath}`);
          // Cubism 4 模型的推荐设置 (您可能需要为每个模型微调)
          model.scale.set(0.10);
          model.position.set(30, 50); // 示例位置
        } else {
          // 这是 Cubism 2 模型
          console.log(`加载 Cubism 2 模型: ${modelPath}`);
          // Cubism 2 模型的推荐设置 (您可能需要为每个模型微调)
          model.scale.set(0.10);
          model.position.set(30, 50); // 示例位置
        }
        
        // 添加交互：点击时触发随机动作
        model.on("hit", (hitAreaNames) => {
          if (hitAreaNames.length > 0) {
            // Body 或 Head 被点击时触发随机动作
            if (hitAreaNames.includes("Body") || hitAreaNames.includes("Head")) {
              model.motion('Tap', undefined, 3); // 3 = 高优先级
            }
          }
        });
      }

      // 5. 监听下拉菜单的 change 事件
      modelSwitcher.addEventListener("change", (event) => {
        loadModel(event.target.value);
      });

      // 6. 页面加载后，默认加载第一个模型
      if (localModels.length > 0) {
        loadModel(localModels[0]);
      }

    })();
  </script>
</body>
</html>
